<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>🍔 Контест по поеданию бургеров</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .highlight {
      background-color: #fef08a;
      transition: background-color 2s ease;
    }
    .rise {
      animation: rise 0.5s ease-in-out;
    }
    @keyframes rise {
      from { transform: translateY(20px); opacity: 0.6; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-900 flex flex-col items-center p-4">
  <h1 class="text-3xl font-bold mb-2">🍔 Контест по поеданию бургеров</h1>
  <p id="timer" class="text-lg mb-6 text-gray-600">Ждём старта...</p>

  <div class="w-full max-w-4xl">
    <table id="leaderboard" class="min-w-full bg-white rounded-xl shadow-lg overflow-hidden">
      <thead class="bg-gray-200 text-gray-700">
        <tr>
          <th class="py-2 px-3 text-left">#</th>
          <th class="py-2 px-3 text-left">Участник</th>
          <th class="py-2 px-3 text-center">🍔</th>
          <th class="py-2 px-3 text-center">⏱️ Лучшее</th>
          <th class="py-2 px-3 text-center">⏱️ Среднее</th>
          <th class="py-2 px-3 text-center">⏱️ Последний</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body"></tbody>
    </table>
  </div>

  <script>
let previousOrder = [];
let contestStartISO = null;

function formatMs(ms) {
  if (!ms) return "–";
  return (ms / 1000).toFixed(1) + "s";
}

function formatElapsed(startISO) {
  if (!startISO) return "—";
  const diff = Date.now() - new Date(startISO).getTime();
  const mins = Math.floor(diff / 60000);
  const secs = Math.floor((diff % 60000) / 1000);
  return `${mins}:${secs.toString().padStart(2, "0")}`;
}

function formatTime(iso) {
  if (!iso) return "–";
  const d = new Date(iso);
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

async function fetchAndUpdate() {
  try {
    const res = await fetch("/leaders", { cache: "no-store" });
    const data = await res.json();
    contestStartISO = data.contest_start || contestStartISO;

    const tbody = document.getElementById("leaderboard-body");
    const leaders = data.leaders || [];

    document.getElementById("timer").innerText =
      contestStartISO ? "⏱ С начала: " + formatElapsed(contestStartISO) : "Ждём старта...";

    tbody.innerHTML = "";
    leaders.forEach((p, index) => {
      const prevIndex = previousOrder.indexOf(p.id);
      const movedUp = prevIndex > index && prevIndex !== -1;

      const tr = document.createElement("tr");
      tr.className = `border-b ${movedUp ? "rise" : ""}`;
      const medal = ["🥇","🥈","🥉"][index] || (index+1);
      const img = p.photo ? `<img src="${p.photo}" class="w-10 h-10 rounded-full inline mr-2">` : "";

      tr.innerHTML = `
        <td class="py-2 px-3 text-center text-lg">${medal}</td>
        <td class="py-2 px-3 flex items-center">${img}<span>${p.name}</span></td>
        <td class="py-2 px-3 text-center font-bold">${p.count}</td>
        <td class="py-2 px-3 text-center">${formatMs(p.best_ms)}</td>
        <td class="py-2 px-3 text-center">${formatMs(p.avg_ms)}</td>
        <td class="py-2 px-3 text-center">${formatTime(p.last_eat)}</td>
      `;
      tbody.appendChild(tr);
    });

    previousOrder = leaders.map(p => p.id);
  } catch(e) {
    console.error(e);
  }
}

setInterval(fetchAndUpdate, 1000); // достаточно 1 секунда, чтобы не перегружать сервер
fetchAndUpdate(); // первый вызов сразу

  </script>
</body>
</html>
